# Puerta de entrada única: escucha en :80 dentro del contenedor
# (publicado como :6060 en el host). Los servicios se resuelven por
# nombre dentro de la red del compose `my-school-my-parents`.
server {
  listen 80;
  server_name _;

  # App web (contenedor `frontend`, vite preview)
  location / {
    proxy_pass http://frontend:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API (contenedor `backend`)
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
    proxy_read_timeout 120s;
  }
}
