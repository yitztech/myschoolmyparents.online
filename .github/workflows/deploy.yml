# Publica las imágenes en GHCR y despliega en Coolify cuando cambia main.
#
#   publicar (backend y nginx) → desplegar (webhook de Coolify) → comprobar /version.json
#
# Adaptado de yitztech/plantilla-cliente; solo cambia la matriz de imágenes.
# El entorno `production` (secretos COOLIFY_WEBHOOK y COOLIFY_TOKEN, variable
# SITE_URL) lo configura la plataforma y solo acepta despliegues desde main.
# Mientras no exista, se publican las imágenes pero no se despliega.
name: Desplegar

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/mobile/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    name: Publicar ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: apps/backend
            file: apps/backend/Dockerfile
            target: prod
          # Las VITE_* acaban dentro del bundle: no son secretos, van como
          # Variables del repositorio. VITE_AUTH_API_URL vacío activaría el
          # mock de auth (el build falla a propósito), así que por defecto /api.
          - name: nginx
            context: .
            file: infra/nginx/Dockerfile.prod
            target: ''
            build_args: |
              RELEASE_SHA=${{ github.sha }}
              VITE_AUTH_API_URL=${{ vars.VITE_AUTH_API_URL || '/api' }}
              VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR exige minúsculas en el nombre de la imagen
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

  desplegar:
    name: Desplegar en Coolify
    needs: publicar
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: ¿Coolify está configurado?
        id: coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$COOLIFY_WEBHOOK" ] && [ -n "$COOLIFY_TOKEN" ] && [ -n "$SITE_URL" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Imágenes publicadas, pero no se despliega: faltan COOLIFY_WEBHOOK, COOLIFY_TOKEN o SITE_URL en el entorno production."
          fi

      - name: Pedir el despliegue a Coolify
        if: steps.coolify.outputs.listo == 'true'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Coolify (4.3.x) solo despliega con POST
          curl --fail-with-body --silent --show-error --retry 3 --max-time 60 \
            --request POST --header "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"

      # Cada redespliegue corta el sitio ~1 minuto (Coolify para y arranca los
      # contenedores): se espera a que /version.json sirva el commit nuevo.
      - name: Comprobar que la versión nueva ya sirve
        if: steps.coolify.outputs.listo == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            revision=$(curl --fail --silent --max-time 10 "$SITE_URL/version.json" | jq -r '.revision' || true)
            if [ "$revision" = "$EXPECTED_SHA" ]; then
              echo "Desplegado: $EXPECTED_SHA"
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::Coolify no sirvió la revisión esperada en 10 minutos."
              exit 1
            fi
            sleep 10
          done
