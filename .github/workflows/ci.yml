# Se ejecuta en cada PR y en cada push a main. No despliega nada: compila la web
# y analiza/prueba la app móvil solo cuando cambia su parte del repositorio.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Qué cambió
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'apps/backend/**'
              - 'apps/frontend/**'
              - 'infra/**'
              - 'e2e/**'
              - 'docker-compose*.yml'
            mobile:
              - 'apps/mobile/**'
              - 'scripts/**'

  web:
    name: Web · tipos y build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
      - run: npm ci --prefix apps/backend --no-audit --no-fund
      - run: npm ci --prefix apps/frontend --no-audit --no-fund
      - run: npm run build --prefix apps/backend
      - run: npm test --prefix apps/backend
      - run: npm run lint --prefix apps/frontend
      - run: npm test --prefix apps/frontend
      - run: npm run build --prefix apps/frontend
        env:
          VITE_AUTH_API_URL: /api

  mobile:
    name: Móvil · tipos y análisis
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --prefix apps/mobile --no-audit --no-fund

      - run: npm run typecheck --prefix apps/mobile
      - run: npx expo-doctor
        working-directory: apps/mobile
      - run: node --test scripts/test-mobile-scripts.mjs

  # §40 de la plataforma: escenarios end-to-end contra el mismo compose que
  # se prueba en local (`docker compose --env-file .env.example up -d`).
  escenarios:
    name: Escenarios · web end-to-end
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Levantar el stack (compose dev, valores de juguete de .env.example)
        run: docker compose --env-file .env.example up -d --build
      - name: Esperar a que la web responda
        run: curl -fsS --retry 60 --retry-delay 2 --retry-connrefused http://localhost:6060/api/health > /dev/null
      - run: npm ci --prefix e2e --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
        working-directory: e2e
      - run: npm test --prefix e2e
      - name: Evidencias de lo que falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: e2e/test-results/
          retention-days: 14

  security:
    name: Seguridad · secretos y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Solo dependencias usadas en ejecución: los avisos de herramientas de
      # build (vite, source-map-js…) no afectan al sitio publicado.
      - name: Auditoría de dependencias de producción (bloquea en high+)
        run: |
          set -eu
          npm audit --prefix apps/backend --omit=dev --audit-level=high
          npm audit --prefix apps/frontend --omit=dev --audit-level=high
          npm audit --prefix e2e --omit=dev --audit-level=high
      # La app móvil (apps/mobile) se audita en informacional: sus avisos
      # pendientes viven en dependencias transitivas del SDK de Expo (
      # @expo/cli, @expo/config: solo build/CLI, no van al bundle) y el
      # arreglo forzado exigiría degradar Expo 57 → 51, peor riesgo.
      - name: Auditoría de la app móvil (informacional)
        run: |
          npm audit --prefix apps/mobile --audit-level=high || true

