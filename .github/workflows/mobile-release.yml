# Instaladores directos de la app (sin tiendas) para usuarios avanzados:
#   APK de Android firmado (scripts/build-android-direct.mjs, en Linux)
#   IPA de iOS sin firmar   (scripts/build-ios-unsigned.mjs, en macOS)
# y una GitHub Release v<versión> con los nombres oficiales (docs/REGLAS-DEL-PROYECTO.md)
# más los alias fijos que enlaza https://myschoolmyparents.online/descargas.
#
# Se lanza a mano (Actions → «App móvil · instaladores» → Run workflow) desde main,
# después de subir la versión en apps/mobile/app.json. No usa EAS: no hace falta
# cuenta de Expo ni de las tiendas.
#
# Secretos (entorno `production`):
#   ANDROID_RELEASE_KEYSTORE_BASE64  base64 de ~/.myschoolmyparents-secrets/android/release.keystore
#   ANDROID_SIGNING_JSON             contenido de ~/.myschoolmyparents-secrets/android/signing.json
# Tienen que ser SIEMPRE los mismos: con otra clave, Android no actualiza sobre
# la versión instalada.
name: App móvil · instaladores

on:
  workflow_dispatch:

concurrency:
  group: mobile-installers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          v=$(node scripts/mobile-version.mjs --json)
          echo "version=$(echo "$v" | jq -r .version)" >> "$GITHUB_OUTPUT"
          echo "build=$(echo "$v" | jq -r .build)" >> "$GITHUB_OUTPUT"
      - name: La versión no puede estar ya publicada
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La release $TAG ya existe. Sube la versión en apps/mobile/app.json."
            exit 1
          fi

  android:
    name: Android (APK firmado)
    needs: version
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
      - name: Clave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          SIGNING: ${{ secrets.ANDROID_SIGNING_JSON }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$SIGNING" ]; then
            echo "::error::Faltan ANDROID_RELEASE_KEYSTORE_BASE64 o ANDROID_SIGNING_JSON en el entorno production."
            exit 1
          fi
          dir="$HOME/.myschoolmyparents-secrets/android"
          mkdir -p "$dir" && chmod 700 "$dir"
          echo "$KEYSTORE" | base64 --decode > "$dir/release.keystore"
          printf '%s' "$SIGNING" > "$dir/signing.json"
          chmod 600 "$dir"/*
      - name: Compilar
        run: node scripts/build-android-direct.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            dist/*.apk
            dist/android.json
          if-no-files-found: error

  ios:
    name: iOS (IPA sin firmar)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
      - name: Compilar
        run: node scripts/build-ios-unsigned.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: |
            dist/*.ipa
            dist/ios.json
          if-no-files-found: error

  publicar:
    name: Publicar release
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Alias de la última versión y notas
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: node scripts/release-notes.mjs dist > "$RUNNER_TEMP/notas.md"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MySchoolMyParents Online v${{ needs.version.outputs.version }} (compilación ${{ needs.version.outputs.build }})
          body_path: ${{ runner.temp }}/notas.md
          make_latest: true
          files: |
            dist/*.apk
            dist/*.ipa
