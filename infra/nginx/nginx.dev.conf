# ─── DEV local ───
# Puerta de entrada única: escucha en :80 dentro del contenedor
# (publicado como :6060 en el host + dominio OrbStack del servicio nginx:
#  http(s)://nginx.my-school-my-parents.orb.local -> este contenedor :80).
#   /     -> frontend:5173 (vite dev con HMR)
#   /api/ -> backend:3001
# Los servicios se resuelven por nombre dentro de la red del compose
# `my-school-my-parents`.
server {
  listen 80;
  # "_" acepta cualquier Host (localhost:6060 y *.orb.local).
  # Se lista el dominio OrbStack explícito para dejarlo documentado.
  server_name _ nginx.my-school-my-parents.orb.local;

  server_tokens off;

  # Sonda del healthcheck del contenedor. No depende de los upstreams, así
  # que sigue respondiendo aunque el vite dev o el backend estén reiniciando.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 "ok\n";
  }

  # Resolver Docker (127.0.0.11) + upstreams por variable: nginx arranca
  # aunque `frontend`/`backend` aún no resuelvan (reinicios, rebuilds) y
  # re-resuelve en cada petición en vez de fallar con "host not found".
  resolver 127.0.0.11 valid=10s;
  set $upstream_frontend http://frontend:5173;
  set $upstream_backend http://backend:3001;

  # Descargas de las apps: igual que en prod (ver nginx.prod.conf.template).
  location = /descargas/android {
    return 302 https://github.com/yitztech/myschoolmyparents.online/releases/latest/download/MySchoolMyParents-Online-android.apk;
  }
  location = /descargas/ios {
    return 302 https://github.com/yitztech/myschoolmyparents.online/releases/latest/download/MySchoolMyParents-Online-ios-sin-firmar.ipa;
  }

  # App web (contenedor `frontend`, vite dev). Los headers Upgrade/Connection
  # permiten el websocket de HMR a través del proxy.
  location / {
    proxy_pass $upstream_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API (contenedor `backend`)
  location /api/ {
    proxy_pass $upstream_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16m;
    proxy_read_timeout 120s;
  }
}
