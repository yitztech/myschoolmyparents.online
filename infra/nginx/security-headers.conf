# ─── Cabeceras de seguridad (PROD) ───
# nginx solo hereda `add_header` si el bloque hijo no define NINGUNA, así que
# este fichero se incluye en cada `location` que añade cabeceras propias.
# HSTS va aquí, como en la plantilla de la plataforma: el Traefik de Coolify
# termina el TLS y redirige http → https, pero no añade la cabecera.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;

# CSP. El token de sesión vive en localStorage, así que un XSS se lo llevaría:
# esta es la principal defensa contra eso.
#   style-src 'unsafe-inline'  -> Radix inyecta estilos en línea; no es evitable.
#   font-src 'self'           -> Fraunces y Karla van autoalojadas (@fontsource), sin Google Fonts.
#   img-src blob:/data:        -> las fotos de las páginas salen de IndexedDB
#                                 vía URL.createObjectURL.
#   connect-src 'self'         -> el frontend solo habla con /api del mismo origen.
#   $analytics_src             -> origen de Umami en script-src y connect-src, o
#                                 vacío sin analítica (lo define 16-analytics.sh).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'$analytics_src; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'$analytics_src; manifest-src 'self'" always;
