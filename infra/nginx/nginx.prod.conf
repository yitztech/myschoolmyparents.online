# ─── PROD (myschoolmyparents.online) ───
# Sirve los estáticos del build Vite (horneados en la imagen por
# nginx/Dockerfile.prod) y proxea /api/ al backend.
#
# Este nginx escucha en :80 y solo se publica en 127.0.0.1: la entrada real
# es el reverse proxy del host (Caddy/Traefik), que termina el TLS y es
# quien debe poner HSTS, el redirect 80->443 y la validación del Host.
server {
  listen 80;
  server_name myschoolmyparents.online www.myschoolmyparents.online;

  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # 16m, no 20m: el límite real del backend son 15 MB por imagen (ver
  # main.ts). Así el rechazo lo da la app con un mensaje útil en vez de
  # nginx con un 413 pelado, pero sin dejar pasar cuerpos mucho mayores.
  client_max_body_size 16m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  include /etc/nginx/snippets/security-headers.conf;

  # Sonda del healthcheck del contenedor. No depende del backend.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain always;
    return 200 "ok\n";
  }

  # Assets con hash: caché larga e inmutable.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Entrada de la SPA: nunca cacheada (así los despliegues entran en vigor).
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA: cualquier ruta no estática sirve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # El healthcheck del backend va directo al contenedor, no pasa por aquí,
  # así que desde fuera este endpoint solo sirve para filtrar información
  # (estado de la BD, uptime, versión).
  location = /api/health {
    access_log off;
    return 404;
  }

  # API (contenedor `backend`)
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Se AÑADE (no se sobrescribe) a lo que venga del proxy del host: el
    # backend confía solo en los rangos privados y corta en la primera IP
    # pública, que es la del cliente real. Ver TRUST_PROXY en .env.example.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
