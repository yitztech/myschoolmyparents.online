plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'online.myschoolmyparents.ocr'
version = '1.0.0'

android {
  namespace "online.myschoolmyparents.ocr"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // ML Kit de texto latino empaquetado: funciona sin conexión.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
